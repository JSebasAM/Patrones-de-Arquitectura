<header class="navbar">
  <div class="container navbar__inner">
    <a routerLink="/" class="navbar__brand">
      <span class="navbar__icon" aria-hidden="true">🏛️</span>
      <span class="navbar__title">Patrones de Arquitectura</span>
    </a>

    <div class="navbar__controls">
      <button
        type="button"
        class="btn-badge"
        (click)="service.toggleOnlyFavorites()"
        [class.btn-badge--active]="service.onlyFavorites()"
        [attr.aria-pressed]="service.onlyFavorites()"
        aria-label="Filtrar por favoritos"
      >
        <span aria-hidden="true">⭐</span>
        <span class="btn-badge__label">Favoritos</span>
        <span class="badge">{{ service.favoritesCount() }}</span>
      </button>

      <button
        type="button"
        class="btn-theme"
        (click)="service.toggleDarkMode()"
        [attr.aria-label]="service.darkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [title]="service.darkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        <span aria-hidden="true">{{ service.darkMode() ? '☀️' : '🌙' }}</span>
      </button>
    </div>
  </div>
</header>
